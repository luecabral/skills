name: Security Audit Tests

on:
  push:
    paths:
      - 'security-audit/**'
  pull_request:
    paths:
      - 'security-audit/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        working-directory: ./security-audit
        run: npm test
